name: Apply chalkboard dashboard enhancements

on:
  push:
    paths:
      - '.github/workflows/apply-chalkboard-enhancements.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enhance Teacher Command Centre
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

/* --- Chalkboard personality upgrade --- */
.table-wrap{width:100%;overflow-x:auto}

.chalk-title,.panel h2,.panel h3,.class-card h3,.history-title{
  font-family:"Segoe Print","Comic Sans MS","Trebuchet MS",cursive;
  letter-spacing:.2px;
  text-shadow:.7px .4px 0 rgba(255,255,255,.18),-.7px -.3px 0 rgba(0,0,0,.18),1.4px -.6px 0 rgba(255,255,255,.06);
}
.chalk-title{
  background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.98) 0 .7px,rgba(243,240,223,.93) .9px 2px,rgba(225,225,211,.72) 2.2px 3px);
  background-size:4px 4px;-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.25px rgba(255,255,255,.35)
}
body:before{
  background-image:radial-gradient(circle,rgba(255,255,255,.12) .55px,transparent .7px),linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.015) 50%,transparent 51%),linear-gradient(0deg,transparent 0 49%,rgba(255,255,255,.012) 50%,transparent 51%);
  background-size:5px 5px,9px 9px,9px 9px
}
.brand{font-size:24px}
.brand small{font-size:14px}
.main{padding:22px 26px 38px;min-width:0;overflow:hidden}

.command-strip{display:grid;grid-template-columns:minmax(280px,1.35fr) minmax(210px,.8fr) minmax(210px,.8fr);gap:16px;align-items:stretch;margin-bottom:18px}
.command-card{position:relative;min-height:132px;padding:16px 18px;border:1.5px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(9,35,30,.42);box-shadow:0 8px 24px var(--shadow);overflow:hidden}
.command-card:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:radial-gradient(circle,rgba(255,255,255,.42) .45px,transparent .75px);background-size:6px 6px}
.welcome h1{font-size:28px;line-height:1.05;margin:0 0 8px}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.mug-quote{display:flex;align-items:center;gap:12px;margin-top:14px}
.mug{font-size:42px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.24))}
.mug-copy{font-family:"Segoe Print","Comic Sans MS",cursive;font-size:15px;line-height:1.25;color:#e9efe9}
.mug-copy strong{display:block;color:var(--yellow);font-size:12px;margin-top:3px;font-family:"Trebuchet MS",sans-serif}
.sticky{background:linear-gradient(145deg,#ffe77d,#f5cf56);color:#1f241f;border-radius:2px 3px 8px 2px;transform:rotate(-1.4deg);box-shadow:0 8px 16px rgba(0,0,0,.28);padding:18px 16px 14px;min-height:132px;position:relative;font-family:"Segoe Print","Comic Sans MS",cursive}
.sticky:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#d84838;top:-8px;left:50%;transform:translateX(-50%);box-shadow:0 3px 3px rgba(0,0,0,.35),inset -3px -3px 4px rgba(0,0,0,.18)}
.sticky .label{font-weight:900;font-size:15px;border-bottom:2px solid rgba(195,70,55,.65);display:inline-block;margin-bottom:8px}
.sticky .word{font-size:21px;font-weight:900;line-height:1.15}
.sticky .def{font-size:13px;line-height:1.35;margin-top:6px}
.date-doodle{display:flex;flex-direction:column;justify-content:space-between}
.datebox{text-align:left;color:#dbe7df;font-size:15px}
.date-icon{font-size:34px;margin-bottom:8px}
.mini-quote{font-family:"Segoe Print","Comic Sans MS",cursive;color:#e7eee9;font-size:15px;line-height:1.3}
.doodle-line{height:3px;margin-top:8px;background:linear-gradient(90deg,var(--blue),var(--green),transparent);border-radius:99px;opacity:.7}
.class-card:after{content:"✦";position:absolute;right:14px;bottom:8px;color:var(--accent);font-size:25px;opacity:.16;transform:rotate(12deg)}
.panel{position:relative}
.panel h2:after,.panel h3:after{content:"";display:block;width:88px;height:2px;margin-top:5px;background:linear-gradient(90deg,currentColor,transparent);opacity:.35}
.bottom-chalk{text-align:center;margin-top:10px;padding:10px 0 2px;font-family:"Segoe Print","Comic Sans MS",cursive;color:#d9e4dc;opacity:.82;font-size:16px}

@media(max-width:1050px){.command-strip{grid-template-columns:1fr 1fr}.welcome{grid-column:1/-1}}
@media(max-width:700px){.command-strip{grid-template-columns:1fr}.welcome{grid-column:auto}.welcome h1{font-size:24px}.sticky{transform:none}.mug{font-size:36px}}
'''
          if '/* --- Chalkboard personality upgrade --- */' not in s:
              s = s.replace('</style>', css + '\n</style>')

          old_header = '''      <div class="topbar">
        <div class="title"><h1>Good day, Neil</h1><p>Same students. Bigger possibilities.</p></div>
        <div class="datebox" id="today"></div>
      </div>'''
          new_header = '''      <div class="command-strip">
        <div class="command-card welcome">
          <h1 class="chalk-title">Teacher Command Centre</h1>
          <p>Plan • Teach • Track • Breathe</p>
          <div class="mug-quote">
            <div class="mug" aria-hidden="true">☕</div>
            <div class="mug-copy">“Teaching is the art of making a difference every day.”<strong>— one cup at a time</strong></div>
          </div>
        </div>
        <div class="sticky" aria-label="Word of the Day">
          <div class="label">Word of the Day</div>
          <div class="word" id="wordOfDayWord">Resilience</div>
          <div class="def" id="wordOfDayDef">The ability to recover quickly from difficulties.</div>
        </div>
        <div class="command-card date-doodle">
          <div>
            <div class="date-icon" aria-hidden="true">📅</div>
            <div class="datebox" id="today"></div>
          </div>
          <div>
            <div class="mini-quote">“Small steps make a big difference.” ✦</div>
            <div class="doodle-line"></div>
          </div>
        </div>
      </div>'''
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          s = s.replace('<div class="brand">Neil\'s<br>Teacher Command Centre<small>chalkboard prototype</small></div>', '<div class="brand chalk-title">Neil\'s<br>Teacher Command Centre<small>plan • teach • track • breathe</small></div>', 1)
          s = s.replace('<div class="quote">“A little progress every day adds up.”</div>', '<div class="quote">“Progress, not perfection.”</div>', 1)

          marker = 'const KEY="neil_teacher_dashboard_v1";'
          words_js = r'''
const WORDS=[
  ["Resilience","The ability to recover quickly from difficulties."],
  ["Curiosity","A strong desire to know, learn, or understand."],
  ["Empathy","The ability to understand and share another person’s feelings."],
  ["Perseverance","Continuing toward a goal despite difficulty or delay."],
  ["Integrity","Being honest and guided by strong moral principles."],
  ["Perspective","A particular way of viewing or understanding something."],
  ["Adaptability","The ability to adjust effectively to new conditions."],
  ["Collaboration","Working together to create or achieve something."],
  ["Initiative","The ability to begin or act without being prompted."],
  ["Reflection","Careful thought about an experience, idea, or decision."],
  ["Gratitude","A feeling of appreciation or thankfulness."],
  ["Courage","The ability to act despite fear or difficulty."],
  ["Inquiry","The act of asking questions to gain knowledge."],
  ["Optimism","Hopefulness and confidence about the future."],
  ["Accountability","Taking responsibility for one’s actions and choices."],
  ["Creativity","Using imagination to produce new ideas or possibilities."],
  ["Community","People connected by place, interests, identity, or purpose."],
  ["Momentum","Forward progress that becomes easier to continue."],
  ["Kindness","The quality of being friendly, generous, and considerate."],
  ["Growth","The process of developing, learning, or becoming more capable."]
];
function setWordOfDay(){
  const start=new Date(new Date().getFullYear(),0,0);
  const now=new Date();
  const day=Math.floor((now-start)/86400000);
  const [word,def]=WORDS[day%WORDS.length];
  const w=document.getElementById("wordOfDayWord"),d=document.getElementById("wordOfDayDef");
  if(w)w.textContent=word;if(d)d.textContent=def;
}

'''
          if 'const WORDS=[' not in s:
              s = s.replace(marker, words_js + marker, 1)

          if '<div class="bottom-chalk">' not in s:
              s = s.replace('    </section>\n\n    <section id="homeworkView"', '      <div class="bottom-chalk">“A better tomorrow starts in this room.”</div>\n    </section>\n\n    <section id="homeworkView"', 1)

          if 'setWordOfDay();\nrenderAll();' not in s:
              s = s.replace('renderAll();\nloadHistory();', 'setWordOfDay();\nrenderAll();\nloadHistory();', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit enhanced dashboard
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No dashboard changes needed."
            exit 0
          fi
          git config user.name "Teacher Command Centre Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Enhance chalkboard dashboard with word of the day"
          git push
