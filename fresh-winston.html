<title>Neil's Teacher Command Centre</title>
<style>html,body{margin:0;width:100%;height:100%;background:#3e2919;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#102421}</style>
</head>
<body>
<iframe id="shell" src="core.html?v=fresh-winston-v5-20260910" title="Teacher Command Centre"></iframe>
<script>
const shell=document.getElementById('shell');
function loadExtras(){
  const coreDoc=shell.contentDocument;if(!coreDoc||!coreDoc.body||coreDoc.getElementById('extrasLoader'))return;
  const marker=coreDoc.createElement('div');marker.id='extrasLoader';marker.hidden=true;coreDoc.body.appendChild(marker);
  const app=coreDoc.getElementById('app');
  const installBridge=()=>{const legacyDoc=app?.contentDocument;if(!legacyDoc||!legacyDoc.body||legacyDoc.getElementById('teacherApiBridge'))return false;const bridge=legacyDoc.createElement('script');bridge.id='teacherApiBridge';bridge.textContent=`window.ROSTERS=ROSTERS;window.KEY=KEY;window.esc=esc;window.renderAll=renderAll;window.absences=absences;window.state=state;`;legacyDoc.body.appendChild(bridge);return true;};
  function addScript(src,onload){const s=coreDoc.createElement('script');s.src=src;if(onload)s.onload=onload;coreDoc.body.appendChild(s)}
  let attempts=0;const timer=setInterval(()=>{if(installBridge()||++attempts>40){clearInterval(timer);addScript('v1-controls.js?v=fresh-v5',()=>{addScript('notes-export.js?v=fresh-v5',()=>{addScript('winston-share.js?v=fresh-v5')});addScript('roster-delete.js?v=fresh-v5');addScript('reminders.js?v=fresh-v5');addScript('navigation-fix.js?v=fresh-v5',()=>{addScript('student-sort.js?v=fresh-v5',()=>{addScript('attendance-ui-fix.js?v=fresh-v5',()=>{addScript('attendance-grid-entry.js?v=fresh-v5',()=>{addScript('assignment-edit.js?v=fresh-v5',()=>{addScript('assignment-calendar.js?v=fresh-v5');addScript('today-canada.js?v=fresh-v5');addScript('export-nav-fix.js?v=fresh-v5');addScript('history-refresh.js?v=fresh-v5');});});});});});});}},150);
}
function forceWinstonButton(){try{const core=shell.contentDocument,app=core&&core.getElementById('app'),d=app&&app.contentDocument,w=app&&app.contentWindow;if(!d||!w||!w.state)return;const old=d.getElementById('downloadWinstonJson');if(!old)return;if(old.dataset.inlineWinstonV5==='1')return;const btn=old.cloneNode(true);btn.id='downloadWinstonJson';btn.dataset.inlineWinstonV5='1';btn.textContent='↗ Send to Winston';old.replaceWith(btn);const section=d.getElementById('winstonExportView');const help=section&&section.querySelector('.export-top .history-help');if(help)help.textContent='Copy your current teacher data, then paste it directly into your ChatGPT conversation with Winston.';const card=btn.closest('.export-card');if(card){const h=card.querySelector('h3');if(h)h.textContent='Send to Winston';const p=card.querySelector('p');if(p)p.textContent='Copies attendance, participation, notes, missing work, and assignment data. Then return to ChatGPT, paste, and send — no downloaded file needed.';}btn.onclick=async function(e){e.preventDefault();e.stopPropagation();const payload=JSON.stringify({format:'teacher-command-centre-winston-export',version:5,exportedAt:new Date().toISOString(),teacherApp:{currentClass:w.currentClass,studentData:w.state},assignmentTracker:(()=>{try{return JSON.parse(w.localStorage.getItem('neil_teacher_assignments_v1'))||{}}catch(_){return{}}})()},null,2);try{await navigator.clipboard.writeText(payload);btn.textContent='✓ Copied — paste in ChatGPT';let s=d.getElementById('winstonSendStatus');if(!s){s=d.createElement('div');s.id='winstonSendStatus';btn.insertAdjacentElement('afterend',s)}s.textContent='Ready. Return to this ChatGPT conversation, press Ctrl+V, and send. Winston will reply “Yeah I got it.”';s.style.cssText='margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid rgba(99,214,139,.45);background:rgba(99,214,139,.08);font-size:13px';}catch(err){btn.textContent='Copy failed';alert('Clipboard access was blocked by the browser.');}}}catch(e){console.error(e)}}
shell.addEventListener('load',()=>{setTimeout(loadExtras,300);setTimeout(forceWinstonButton,1600)});setTimeout(loadExtras,1200);setInterval(forceWinstonButton,400);
</script>
</body>
</html>
