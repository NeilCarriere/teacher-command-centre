<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#102421">
<title>Neil's Teacher Command Centre</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#3e2919;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#102421}
</style>
</head>
<body>
<iframe id="shell" src="core.html?v=winston-v11-20260910" allow="clipboard-write" title="Teacher Command Centre"></iframe>
<script>
const shell=document.getElementById('shell');
function loadExtras(){
  const coreDoc=shell.contentDocument;
  if(!coreDoc||!coreDoc.body||coreDoc.getElementById('extrasLoader'))return;
  const marker=coreDoc.createElement('div');marker.id='extrasLoader';marker.hidden=true;coreDoc.body.appendChild(marker);
  const app=coreDoc.getElementById('app');
  if(app)app.setAttribute('allow','clipboard-write');
  const installBridge=()=>{
    const legacyDoc=app?.contentDocument;
    if(!legacyDoc||!legacyDoc.body||legacyDoc.getElementById('teacherApiBridge'))return false;
    const bridge=legacyDoc.createElement('script');
    bridge.id='teacherApiBridge';
    bridge.textContent=`
      window.ROSTERS=ROSTERS;window.KEY=KEY;window.esc=esc;window.renderAll=renderAll;window.absences=absences;
      const PERSIST_KEY='neil_teacher_dashboard_v2';
      function rebuildState(saved){const fresh=blankState();if(!saved||!saved.students)return fresh;Object.keys(fresh.students).forEach(function(c){Object.keys(fresh.students[c]).forEach(function(n){if(saved.students&&saved.students[c]&&saved.students[c][n])fresh.students[c][n]=saved.students[c][n];});});fresh.currentClass=saved.currentClass||fresh.currentClass;fresh.assignments=Array.isArray(saved.assignments)?saved.assignments:[];Object.keys(saved).forEach(function(k){if(k!=='students'&&k!=='currentClass'&&k!=='assignments')fresh[k]=saved[k];});return fresh;}
      function readBestSavedState(){for(const k of [PERSIST_KEY,KEY]){try{const raw=localStorage.getItem(k);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.students)return parsed;}}catch(e){}}return null;}
      const recovered=readBestSavedState();if(recovered){state=rebuildState(recovered);currentClass=state.currentClass||currentClass||'Civics';}
      function persistTeacherState(){try{state.currentClass=currentClass;state.lastSavedAt=new Date().toISOString();const json=JSON.stringify(state);localStorage.setItem(KEY,json);localStorage.setItem(PERSIST_KEY,json);try{window.parent.localStorage.setItem(PERSIST_KEY,json);}catch(e){}try{window.top.localStorage.setItem(PERSIST_KEY,json);}catch(e){}return true;}catch(e){console.error('Teacher dashboard save failed',e);return false;}}
      save=function(){persistTeacherState();renderAll();};window.saveTeacherState=function(){const ok=persistTeacherState();renderAll();return ok;};window.state=state;Object.defineProperty(window,'currentClass',{configurable:true,get:function(){return currentClass;},set:function(v){currentClass=v;state.currentClass=v;persistTeacherState();}});
      if(!document.getElementById('manualSaveBtn')){const nav=document.querySelector('.nav');if(nav){const btn=document.createElement('button');btn.id='manualSaveBtn';btn.type='button';btn.textContent='💾 Save Now';btn.title='Manually save all dashboard information on this device';btn.onclick=function(){const ok=persistTeacherState();const original='💾 Save Now';btn.textContent=ok?'✓ Saved':'⚠ Save failed';btn.style.borderColor=ok?'#63d68b':'#ff6b6b';setTimeout(function(){btn.textContent=original;btn.style.borderColor='';},1800);};const reset=document.getElementById('resetBtn');if(reset)nav.insertBefore(btn,reset);else nav.appendChild(btn);}}
      window.addEventListener('pagehide',persistTeacherState);window.addEventListener('beforeunload',persistTeacherState);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')persistTeacherState();});persistTeacherState();renderAll();
    `;legacyDoc.body.appendChild(bridge);return true;
  };
  function addScript(src,onload){const s=coreDoc.createElement('script');s.src=src;if(onload)s.onload=onload;coreDoc.body.appendChild(s)}
  let attempts=0;const timer=setInterval(()=>{
    if(installBridge()||++attempts>30){
      clearInterval(timer);
      addScript('v1-controls.js?v=20260910-direct-winston-v11',()=>{
        addScript('notes-export.js?v=20260910-source-v7');
        addScript('roster-delete.js?v=20260910-manual-save');
        addScript('reminders.js?v=20260910-reminder-layout-v2');
        addScript('navigation-fix.js?v=20260910-manual-save',()=>{
          addScript('student-sort.js?v=20260910-manual-save',()=>{
            addScript('attendance-ui-fix.js?v=20260910-full-roster',()=>{
              addScript('attendance-grid-entry.js?v=20260910-manual-save',()=>{
                addScript('assignment-edit.js?v=20260910-manual-save',()=>{
                  addScript('assignment-calendar.js?v=20260910-calendar-v2',()=>{
                    addScript('assignment-levels.js?v=20260910-rubric-levels-v2');
                  });
                  addScript('alert-details.js?v=20260910-alert-details-v1');
                  addScript('today-canada.js?v=20260910-headline-refresh-2');
                  addScript('history-refresh.js?v=20260910-canadian-history');
                });
              });
            });
          });
        });
      });
    }
  },150);
}
shell.addEventListener('load',()=>setTimeout(loadExtras,300));
setTimeout(loadExtras,1200);
</script>
</body>
</html>
