<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#102421">
<title>Neil's Teacher Command Centre</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#3e2919;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#102421}
</style>
</head>
<body>
<iframe id="shell" src="core.html?v=assignment-calendar-20260909-1515" title="Teacher Command Centre"></iframe>
<script>
const shell=document.getElementById('shell');
function loadExtras(){
  const coreDoc=shell.contentDocument;
  if(!coreDoc||!coreDoc.body||coreDoc.getElementById('extrasLoader'))return;
  const marker=coreDoc.createElement('div');marker.id='extrasLoader';marker.hidden=true;coreDoc.body.appendChild(marker);
  const app=coreDoc.getElementById('app');
  const installBridge=()=>{
    const legacyDoc=app?.contentDocument;
    if(!legacyDoc||!legacyDoc.body||legacyDoc.getElementById('teacherApiBridge'))return false;
    const bridge=legacyDoc.createElement('script');bridge.id='teacherApiBridge';bridge.textContent=`window.ROSTERS=ROSTERS;window.state=state;window.KEY=KEY;window.esc=esc;window.renderAll=renderAll;window.absences=absences;window.saveTeacherState=function(){localStorage.setItem(KEY,JSON.stringify(state));renderAll();};Object.defineProperty(window,'currentClass',{configurable:true,get:function(){return currentClass;},set:function(v){currentClass=v;state.currentClass=v;}});`;legacyDoc.body.appendChild(bridge);return true;
  };
  function addScript(src,onload){const s=coreDoc.createElement('script');s.src=src;if(onload)s.onload=onload;coreDoc.body.appendChild(s)}
  let attempts=0;const timer=setInterval(()=>{
    if(installBridge()||++attempts>30){
      clearInterval(timer);
      addScript('v1-controls.js?v=20260909-1515',()=>{
        addScript('notes-export.js?v=20260909-1515');
        addScript('roster-delete.js?v=20260909-1515');
        addScript('reminders.js?v=20260909-1515');
        addScript('navigation-fix.js?v=20260909-1515',()=>{
          addScript('student-sort.js?v=20260909-1515',()=>{
            addScript('attendance-ui-fix.js?v=20260909-1515',()=>{
              addScript('attendance-grid-entry.js?v=20260909-1515',()=>{
                addScript('assignment-edit.js?v=20260909-1515',()=>{
                  addScript('assignment-calendar.js?v=20260909-1515');
                });
              });
            });
          });
        });
      });
    }
  },150);
}
shell.addEventListener('load',()=>setTimeout(loadExtras,300));setTimeout(loadExtras,1200);
</script>
</body>
</html>
