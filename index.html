ns MS",cursive;font-size:24px;margin:0}.assignment-empty{padding:20px;border:1px dashed rgba(255,255,255,.18);border-radius:10px;color:var(--muted);text-align:center}.archive-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.archive-toggle input{width:18px;height:18px}

  const date=d.getElementById('todayFancy');if(date)date.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const words=[['Resilience','The ability to recover quickly from difficulties.'],['Curiosity','A strong desire to know, learn, or understand.'],['Empathy','The ability to understand and share another person’s feelings.'],['Perseverance','Continuing toward a goal despite difficulty or delay.'],['Integrity','Being honest and guided by strong moral principles.'],['Perspective','A particular way of viewing or understanding something.'],['Adaptability','The ability to adjust effectively to new conditions.'],['Collaboration','Working together to create or achieve something.'],['Initiative','The ability to begin or act without being prompted.'],['Reflection','Careful thought about an experience, idea, or decision.'],['Gratitude','A feeling of appreciation or thankfulness.'],['Courage','The ability to act despite fear or difficulty.'],['Inquiry','The act of asking questions to gain knowledge.'],['Optimism','Hopefulness and confidence about the future.'],['Accountability','Taking responsibility for one’s actions and choices.'],['Creativity','Using imagination to produce new ideas or possibilities.'],['Community','People connected by place, interests, identity, or purpose.'],['Momentum','Forward progress that becomes easier to continue.'],['Kindness','The quality of being friendly, generous, and considerate.'],['Growth','The process of developing, learning, or becoming more capable.']];

  }

  const script=d.createElement('script');
  script.textContent=`
  (function(){
    const historyView=document.getElementById('attendanceHistoryView');
    const clsSel=document.getElementById('attendanceClassSelect');
    const monthInput=document.getElementById('attendanceMonth');
    const dateInput=document.getElementById('attendanceDate');
    clsSel.innerHTML=Object.keys(ROSTERS).map(c=>'<option>'+esc(c)+'</option>').join('');
    const now=new Date(),pad=n=>String(n).padStart(2,'0');
    const localISO=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
    dateInput.value=localISO(now);monthInput.value=localISO(now).slice(0,7);
    function showOnly(id){['dashboardView','homeworkView','reportsView','attendanceHistoryView','assignmentTrackerView'].forEach(x=>document.getElementById(x)?.classList.toggle('hidden',x!==id));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(id==='attendanceHistoryView')document.getElementById('attendanceHistoryNav')?.classList.add('active');else if(id==='assignmentTrackerView')document.getElementById('assignmentTrackerNav')?.classList.add('active');else document.querySelector('.nav button[data-view="dashboard"]')?.classList.add('active')}
    window.teacherShowOnly=showOnly;
    function getRecord(name){return state.students[clsSel.value][name]}
    function statusOn(rec,date){return rec.attendance.find(x=>x.date===date)?.status||''}
    function setStatus(name,date,status){const rec=getRecord(name),before=absences(rec),idx=rec.attendance.findIndex(x=>x.date===date);if(status===''){if(idx>=0)rec.attendance.splice(idx,1)}else if(idx>=0)rec.attendance[idx].status=status;else rec.attendance.push({date,status});const after=absences(rec);state.currentClass=clsSel.value;currentClass=clsSel.value;localStorage.setItem(KEY,JSON.stringify(state));renderAll();renderAttendanceHistory();if(typeof thresholdReached==='function'&&typeof showThresholdAlert==='function'){const reached=thresholdReached(before,after);if(reached)showThresholdAlert(name,reached)}}
    function renderMonth(){const [y,m]=monthInput.value.split('-').map(Number),days=new Date(y,m,0).getDate(),names=ROSTERS[clsSel.value];let html='<table><thead><tr><th>Student</th>';for(let day=1;day<=days;day++)html+='<th>'+day+'</th>';html+='</tr></thead><tbody>';for(const name of names){html+='<tr><td><strong>'+esc(name)+'</strong></td>';for(let day=1;day<=days;day++){const ds=y+'-'+pad(m)+'-'+pad(day),st=statusOn(getRecord(name),ds);html+='<td class="month-cell" data-date="'+ds+'" data-status="'+st+'" title="'+ds+'">'+(st||'·')+'</td>'}html+='</tr>'}html+='</tbody></table>';document.getElementById('attendanceMonthOverview').innerHTML=html;document.querySelectorAll('.month-cell').forEach(cell=>cell.onclick=()=>{dateInput.value=cell.dataset.date;renderEdit()})}
    function renderEdit(){const date=dateInput.value||localISO(now),names=ROSTERS[clsSel.value],pretty=new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('attendanceEditTitle').textContent='Edit '+pretty;let rows=names.map((name,i)=>{const st=statusOn(getRecord(name),date);return '<tr><td>'+(i+1)+'</td><td><strong>'+esc(name)+'</strong></td><td><div class="statuses">'+['P','A','E','L'].map(s=>'<button class="status-btn '+(st===s?'active':'')+'" data-hist-student="'+esc(name)+'" data-hist-status="'+s+'">'+s+'</button>').join('')+'<button class="status-btn" data-hist-student="'+esc(name)+'" data-hist-status="">Clear</button></div></td></tr>'}).join('');document.getElementById('attendanceEditTable').innerHTML='<thead><tr><th>#</th><th>Student</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody>';document.querySelectorAll('[data-hist-student]').forEach(b=>b.onclick=()=>setStatus(b.dataset.histStudent,date,b.dataset.histStatus))}
    function renderAttendanceHistory(){renderMonth();renderEdit()}
    window.openAttendanceHistory=function(cls){if(cls&&ROSTERS[cls])clsSel.value=cls;currentClass=clsSel.value;state.currentClass=currentClass;monthInput.value=(dateInput.value||localISO(now)).slice(0,7);showOnly('attendanceHistoryView');renderAttendanceHistory()}
    clsSel.onchange=()=>{currentClass=clsSel.value;state.currentClass=currentClass;renderAttendanceHistory()};
    monthInput.onchange=()=>{if(monthInput.value){dateInput.value=monthInput.value+'-01'}renderAttendanceHistory()};
    dateInput.onchange=()=>{if(dateInput.value)monthInput.value=dateInput.value.slice(0,7);renderAttendanceHistory()};
    document.getElementById('attendanceTodayBtn').onclick=()=>{dateInput.value=localISO(new Date());monthInput.value=dateInput.value.slice(0,7);renderAttendanceHistory()};
    document.getElementById('attendanceBackBtn').onclick=()=>showOnly('dashboardView');
    document.getElementById('attendanceHistoryNav').onclick=()=>openAttendanceHistory(currentClass);
    document.addEventListener('click',e=>{const b=e.target.closest('.class-card .mini-btn');if(b&&b.textContent.trim()==='Attendance'){e.preventDefault();e.stopImmediatePropagation();openAttendanceHistory(b.dataset.open)}},true);
    const take=document.getElementById('takeAttendanceBtn');if(take){const historyBtn=document.createElement('button');historyBtn.className='secondary';historyBtn.textContent='View / Edit Past Attendance';historyBtn.onclick=()=>openAttendanceHistory(currentClass);take.parentElement.appendChild(historyBtn)}
  })();

  (function(){
    const ASSIGN_KEY='neil_teacher_assignments_v1';
    let selectedClass=currentClass||Object.keys(ROSTERS)[0];
    let selectedAssignmentId=null;
    const tabs=document.getElementById('assignmentTabs'),list=document.getElementById('assignmentList'),detail=document.getElementById('assignmentDetail'),summary=document.getElementById('assignmentSummary');
    const nameInput=document.getElementById('trackerAssignmentName'),assignedInput=document.getElementById('trackerAssignedDate'),dueInput=document.getElementById('trackerDueDate'),maxInput=document.getElementById('trackerMaxMark'),showArchived=document.getElementById('trackerShowArchived');
    const now=new Date(),pad=n=>String(n).padStart(2,'0'),iso=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
    assignedInput.value=iso(now);dueInput.value=iso(now);maxInput.value='100';
    function blank(){const classes={};Object.keys(ROSTERS).forEach(c=>classes[c]={assignments:[]});return{classes}}
    function load(){try{const x=JSON.parse(localStorage.getItem(ASSIGN_KEY));if(x&&x.classes){const b=blank();Object.keys(b.classes).forEach(c=>{if(x.classes[c]?.assignments)b.classes[c].assignments=x.classes[c].assignments});return b}}catch(e){}return blank()}
    let data=load();
    function saveAssignments(){localStorage.setItem(ASSIGN_KEY,JSON.stringify(data))}
    function ensureStudentRecords(a){if(!a.students)a.students={};ROSTERS[selectedClass].forEach(n=>{if(!a.students[n])a.students[n]={submitted:false,mark:'',note:''}})}
    function activeAssignments(cls){return data.classes[cls].assignments.filter(a=>!a.archived)}
    function findAssignment(){return data.classes[selectedClass].assignments.find(a=>a.id===selectedAssignmentId)||null}
    function countOutstanding(a){ensureStudentRecords(a);return ROSTERS[selectedClass].filter(n=>!a.students[n].submitted).length}
    function markedStats(a){ensureStudentRecords(a);const vals=ROSTERS[selectedClass].map(n=>Number(a.students[n].mark)).filter(v=>Number.isFinite(v)&&a.students&&String(v)!==''&&v>=0);const marked=ROSTERS[selectedClass].filter(n=>String(a.students[n].mark??'').trim()!=='').length;const nums=ROSTERS[selectedClass].map(n=>String(a.students[n].mark??'').trim()).filter(v=>v!=='').map(Number).filter(Number.isFinite);return{marked,avg:nums.length?nums.reduce((x,y)=>x+y,0)/nums.length:null}}
    function renderTabs(){tabs.innerHTML=Object.keys(ROSTERS).map(c=>'<button class="assignment-tab '+(c===selectedClass?'active':'')+'" data-assignment-class="'+esc(c)+'">'+esc(c)+'<span class="count">'+activeAssignments(c).length+'</span></button>').join('');tabs.querySelectorAll('[data-assignment-class]').forEach(b=>b.onclick=()=>{selectedClass=b.dataset.assignmentClass;currentClass=selectedClass;state.currentClass=currentClass;selectedAssignmentId=null;renderAllAssignments()})}
    function renderList(){const all=data.classes[selectedClass].assignments.filter(a=>showArchived.checked||!a.archived);const active=activeAssignments(selectedClass);summary.textContent=active.length+' outstanding assignment'+(active.length===1?'':'s')+' for '+selectedClass+'.';if(!all.length){list.innerHTML='<div class="assignment-empty">No assignments recorded for this class yet.</div>';detail.innerHTML='';return}list.innerHTML=all.slice().sort((a,b)=>(b.assigned||'').localeCompare(a.assigned||'')).map(a=>{ensureStudentRecords(a);const out=countOutstanding(a),stats=markedStats(a);return '<div class="assignment-card"><div><h4>'+esc(a.name)+(a.archived?' <span class="small">(archived)</span>':'')+'</h4><div class="assignment-meta">Assigned '+esc(a.assigned||'—')+' · Due '+esc(a.due||'—')+' · Out of '+esc(a.maxMark||100)+'</div><div class="assignment-stats"><span class="assignment-chip">'+out+' not handed in</span><span class="assignment-chip">'+stats.marked+' marks entered</span>'+(stats.avg!==null?'<span class="assignment-chip">Average '+stats.avg.toFixed(1)+' / '+esc(a.maxMark||100)+'</span>':'')+'</div></div><div class="assignment-actions"><button class="secondary" data-open-assignment="'+a.id+'">Open</button><button class="secondary" data-archive-assignment="'+a.id+'">'+(a.archived?'Restore':'Archive')+'</button></div></div>'}).join('');list.querySelectorAll('[data-open-assignment]').forEach(b=>b.onclick=()=>{selectedAssignmentId=b.dataset.openAssignment;renderDetail()});list.querySelectorAll('[data-archive-assignment]').forEach(b=>b.onclick=()=>{const a=data.classes[selectedClass].assignments.find(x=>x.id===b.dataset.archiveAssignment);if(a){a.archived=!a.archived;saveAssignments();if(a.archived&&selectedAssignmentId===a.id)selectedAssignmentId=null;renderAllAssignments()}});if(selectedAssignmentId)renderDetail();else detail.innerHTML=''}
    function renderDetail(){const a=findAssignment();if(!a){detail.innerHTML='';return}ensureStudentRecords(a);const max=Number(a.maxMark)||100;const rows=ROSTERS[selectedClass].map((n,i)=>{const r=a.students[n]||{submitted:false,mark:'',note:''};return '<tr class="'+(r.submitted?'submitted-row':'missing-row')+'"><td>'+(i+1)+'</td><td><strong>'+esc(n)+'</strong></td><td><input type="checkbox" data-submit-student="'+esc(n)+'" '+(r.submitted?'checked':'')+' aria-label="Handed in"></td><td><input type="number" min="0" max="'+max+'" step="0.5" data-mark-student="'+esc(n)+'" value="'+esc(r.mark??'')+'" placeholder="—"></td><td class="small">'+(r.submitted?'Handed in':'Outstanding')+'</td></tr>'}).join('');detail.innerHTML='<div class="assignment-top"><div><h3>'+esc(a.name)+'</h3><div class="assignment-meta">'+countOutstanding(a)+' students outstanding · marks out of '+max+'</div></div><button class="secondary" id="closeAssignmentDetail">Close</button></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Student</th><th>Handed In</th><th>Mark</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';detail.querySelector('#closeAssignmentDetail').onclick=()=>{selectedAssignmentId=null;detail.innerHTML=''};detail.querySelectorAll('[data-submit-student]').forEach(cb=>cb.onchange=()=>{const r=a.students[cb.dataset.submitStudent];r.submitted=cb.checked;saveAssignments();renderDetail();renderTabs();renderList()});detail.querySelectorAll('[data-mark-student]').forEach(inp=>inp.onchange=()=>{const r=a.students[inp.dataset.markStudent];let v=inp.value.trim();if(v===''){r.mark=''}else{let num=Number(v);if(!Number.isFinite(num))num=0;num=Math.max(0,Math.min(max,num));r.mark=String(num);r.submitted=true}saveAssignments();renderDetail();renderTabs();renderList()})}
    function renderAllAssignments(){renderTabs();renderList()}
    function openTracker(cls,openForm=false){if(cls&&ROSTERS[cls])selectedClass=cls;currentClass=selectedClass;state.currentClass=currentClass;selectedAssignmentId=null;window.teacherShowOnly?.('assignmentTrackerView');renderAllAssignments();if(openForm)setTimeout(()=>nameInput.focus(),0)}
    window.openAssignmentTracker=openTracker;
    document.getElementById('assignmentTrackerNav').onclick=()=>openTracker(currentClass);
    document.getElementById('assignmentBackBtn').onclick=()=>window.teacherShowOnly?.('dashboardView');
    document.getElementById('trackerAddAssignment').onclick=()=>{const name=nameInput.value.trim();if(!name){alert('Enter an assignment name.');return}const max=Math.max(1,Number(maxInput.value)||100);const a={id:'a'+Date.now()+Math.random().toString(36).slice(2,6),name,assigned:assignedInput.value||iso(now),due:dueInput.value||'',maxMark:max,archived:false,students:{}};ROSTERS[selectedClass].forEach(n=>a.students[n]={submitted:false,mark:'',note:''});data.classes[selectedClass].assignments.push(a);saveAssignments();nameInput.value='';maxInput.value=String(max);selectedAssignmentId=a.id;renderAllAssignments();renderDetail()};
    showArchived.onchange=renderList;
    document.addEventListener('click',e=>{const b=e.target.closest('.class-card .mini-btn');if(b&&b.textContent.trim()==='Assignments'){e.preventDefault();e.stopImmediatePropagation();openTracker(b.dataset.open)}},true);
    const add=document.getElementById('addAssignmentBtn');if(add)add.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openTracker(currentClass,true)},true);
    renderAllAssignments();
  })();`;
  d.body.appendChild(script);
}
